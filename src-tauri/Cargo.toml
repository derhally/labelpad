[package]
name = "niimbot-studio"
version = "0.1.0"
description = "A modern desktop app for the Niimbot D11 label printer"
authors = ["Zeid"]
license = "MIT"
edition = "2021"

[lib]
name = "niimbot_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
niimbot = { path = "niimbot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }

[workspace]
members = ["niimbot"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
