[package]
name = "labelpad"
version = "0.3.0"
description = "A modern label designer for Niimbot-compatible Bluetooth label printers"
authors = ["Zeid"]
license = "MIT"
edition = "2021"

[lib]
name = "labelpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
env_logger = "0.11"
fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap"] }
interprocess = { version = "2", features = ["tokio"] }
log = "0.4"
printer = { path = "printer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "io-util", "io-std", "time", "macros"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[workspace]
members = ["printer"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
