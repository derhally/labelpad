[package]
name = "niimbot"
version = "0.1.0"
edition = "2021"
description = "Niimbot label printer protocol over Bluetooth LE, ported from niimbluelib"
license = "MIT"

[features]
default = ["ble"]
ble = ["dep:btleplug", "dep:uuid"]

[dependencies]
btleplug = { version = "0.13", optional = true }
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
uuid = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }
